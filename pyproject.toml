[project]
name = "streamrag"
version = "0.1.0"
description = "Offline-first livestream transcript refinement and RAG indexing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lancedb==0.40.0",
    "jieba==0.42.1",
    "sentence-transformers==5.1.2",
    "transformers==4.57.1",
    "torch==2.10.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
